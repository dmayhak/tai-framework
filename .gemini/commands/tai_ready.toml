rollup — display only, never the readiness source itself, brief §7).

Present this list to the human. If they pick one, follow up with `/tai_work <KEY>` for
that issue — same underlying flow, `/tai_ready` is only for when there's no specific key
in mind yet (brief §3.8).
"""
