description = "Show what's ready to work on, optionally scoped to one persona (brief §3.8)"

prompt = """
!{npx tsx src/hosts/cli.ts ready {{args}}}

The output above lists issues that are actually ready to start (open, and — for a
subtask — with every precedence prerequisite already Done or Canceled, per
