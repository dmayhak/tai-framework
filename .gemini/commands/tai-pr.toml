description = "Create, review, or merge a real git PR for a Dev/CodeReview subtask (TAI-34 ADR)"

# Deliberately does NOT use `{{args}}` inside a `!{...}` shell-injection block, unlike
# tai-work.toml/tai-ready.toml. Gemini CLI shell-escapes `{{args}}` as ONE unit before
# substitution (its own docs, custom-commands.md, "Using arguments in shell commands") --
# fine for tai-work/tai-ready, which only ever take a single space-free argument (an issue
# key), but git-pr needs several space-separated positional args (action, issue key, repo,
# branch names, a title that may itself contain spaces). `!{... {{args}}}` here would
# collapse the whole typed command into one quoted argv token and fail every time -- found
# live (2026-08-17) during TAI-87's own smoke test: `/tai-pr merge TAI-87
# dmayhak/tai-framework` became `git-pr "merge TAI-87 dmayhak/tai-framework"`.
#
# Omitting `{{args}}` switches Gemini CLI to "default argument handling" instead (same
# docs, §2): it appends the raw typed command as text rather than injecting it into a
# shell command itself, and the model parses it and runs the command via its own shell
# tool -- the docs' own recommended pattern for exactly this case (their `changelog.toml`
# example).

prompt = """
# Task: run a TAI git-pr action

Your raw typed command is appended below these instructions (Gemini CLI's default
argument-handling behavior, since this prompt has no `{{args}}` placeholder). Parse out
the action and its arguments yourself, then run the matching command **directly via your
own shell tool** -- construct it as separate, correctly-quoted arguments (not one blob),
so a multi-word title/description/comment survives intact:

  npx tsx src/hosts/cli.ts git-pr create <ISSUE-KEY> <REPO> <SOURCE_BRANCH> <DEST_BRANCH> <TITLE> [DESCRIPTION]
  npx tsx src/hosts/cli.ts git-pr review <ISSUE-KEY> <REPO> [PR-ID] <approve|requestChanges> [COMMENT]
  npx tsx src/hosts/cli.ts git-pr merge <ISSUE-KEY> <REPO> [PR-ID] [mergeCommit|squash|fastForward]

`[PR-ID]` is optional on `review`/`merge` — omit it and TAI resolves it against `REPO`'s
sole currently-open PR. If more than one is open, the command fails with a list of
candidates instead of guessing — pass one of those IDs explicitly and re-run.

The output is from TAI's own `GitHost` layer (TAI-73), invoked as whichever persona owns
the issue key you passed — it resolves that persona's identity from the issue's own
`persona` field and enforces its `gitHost` permission grant, the same way `/tai-work`
enforces `workOn`.

- `create` — Dev subtask done, opens the real PR (source = the Story's branch, brief §6;
  destination = the repo's default branch). `SOURCE_BRANCH` is validated against this
  rule (TAI-107/108) — a branch named after a subtask's own key instead of the parent
  Story/Bug's fails loudly rather than silently opening the PR anyway. `TITLE` is
  validated too (TAI-112): it must start with `<StoryKey> - <SubtaskKey> - ` when
  `<ISSUE-KEY>` is a subtask, or just `<StoryKey> - ` when `<ISSUE-KEY>` is itself a
  Story/Bug (e.g. a PM/Architect governance-content PR with no owning subtask) — write
  the title yourself with that prefix, it is not constructed for you. Also
  auto-links the new PR to whichever CodeReview subtask should review it (a Jira remote
  issue link, brief §5.4) — no separate manual linking step needed anymore.
- `review` — Code Reviewer subtask, approve or request changes on the real PR diff. This
  writes the PR only — also transition the Jira CodeReview subtask yourself as the second
  half of the review decision (`workflows/story.md`'s PR-backed checkpoint chain).
- `merge` — Developer merges their own already-approved work once CodeReview passes; not
  self-certification, since the approval already happened as a separate persona action.
  Gated on `GitHost.getCommitStatuses` being green first (brief §5.4, TAI-107/108) — a
  red or missing CI status is reported as "Merge denied," the same shape as any other
  merge rejection, without attempting the merge.

If the command errors (unknown issue key, no persona assigned, or the persona isn't
permitted to perform this `gitHost` action), report the error to the human rather than
guessing or proceeding anyway.
"""
