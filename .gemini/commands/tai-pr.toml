description = "Create, review, or merge a real git PR for a Dev/CodeReview subtask (TAI-34 ADR)"

prompt = """
!{npx tsx src/hosts/cli.ts git-pr {{args}}}

The output above is from TAI's own `GitHost` layer (TAI-73), invoked as whichever persona
owns the issue key you passed — it resolves that persona's identity from the issue's own
`persona` field and enforces its `gitHost` permission grant, the same way `/tai-work`
enforces `workOn`.

Usage (same shape as running `cli.ts git-pr` directly — quote any argument containing
spaces, e.g. a PR title):

  /tai-pr create <ISSUE-KEY> <REPO> <SOURCE_BRANCH> <DEST_BRANCH> <TITLE> [DESCRIPTION]
  /tai-pr review <ISSUE-KEY> <REPO> [PR-ID] <approve|requestChanges> [COMMENT]
  /tai-pr merge <ISSUE-KEY> <REPO> [PR-ID] [mergeCommit|squash|fastForward]

`[PR-ID]` is optional on `review`/`merge` — omit it and TAI resolves it against `REPO`'s
sole currently-open PR. If more than one is open, the command fails with a list of
candidates instead of guessing — pass one of those IDs explicitly and re-run.

- `create` — Dev subtask done, opens the real PR (source = the Story's branch, brief §6;
  destination = the repo's default branch).
- `review` — Code Reviewer subtask, approve or request changes on the real PR diff. This
  writes the PR only — also transition the Jira CodeReview subtask yourself as the second
  half of the review decision (`workflows/story.md`'s PR-backed checkpoint chain).
- `merge` — Developer merges their own already-approved work once CodeReview passes; not
  self-certification, since the approval already happened as a separate persona action.

If the command above errored (unknown issue key, no persona assigned, or the persona isn't
permitted to perform this `gitHost` action), report the error to the human rather than
guessing or proceeding anyway.
"""
